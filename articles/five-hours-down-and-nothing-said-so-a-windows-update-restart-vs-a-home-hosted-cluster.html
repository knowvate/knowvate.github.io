  <!-- default-src is intentionally tight ('self' only) - every resource type
       this app actually loads has its own explicit directive below, so
       default-src only matters as a fallback for things like object-src/
       base-uri/form-action, which get their own tighter values here too.

       script-src is 'self' only: the app loads no third-party scripts (the
       contact page's Google Map is an iframe - frame-src), and no inline
       ones. The login token lives in localStorage, so this is what stops an
       injected script from reading it. Two things keep it that way:
       - angular.json turns off critical-CSS inlining (inlineCritical). It
         adds an inline <script> that switches the stylesheets from
         media="print" to "all"; blocked, the page renders with no CSS at
         all. That's what broke the header layout when 'unsafe-inline' was
         first dropped.
       - scripts/check-csp.mjs fails CI and the deploy if the built
         index.html gains an inline script or event handler, or this policy
         loosens script-src or allows a plain-http/localhost connection.
       The JSON-LD block above is a data block, not a script, so CSP doesn't
       apply to it.

       'unsafe-inline' remains on style-src: Angular injects component
       styles as unnonced <style> tags at runtime.

       media-src allows blob: for the Drive preview, which fetches a file
       with the auth header and plays it from an in-memory blob: URL.

       connect-src has no localhost: local dev (ng serve) proxies /api to the
       backend (proxy.conf.js), so it's same-origin there too. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://maps.google.com https://drive.google.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.google.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; media-src 'self' blob: https://api.coatsc.uk; connect-src 'self' https://api.coatsc.uk;">
