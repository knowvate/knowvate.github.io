  <!-- default-src is intentionally tight ('self' only) - every resource type
       this app actually loads has its own explicit directive below, so
       default-src only matters as a fallback for things like object-src/
       base-uri/form-action, which get their own tighter values here too.
       'unsafe-eval' is dropped since Angular's production AOT build doesn't
       need it. 'unsafe-inline' remains on script-src/style-src - Angular
       injects component styles as unnonced <style> tags at runtime, and
       removing it safely needs CSP nonce support wired through the server
       render, which is a bigger change than fits here.

       A same-day attempt to drop 'unsafe-inline' from script-src (in favor
       of hashing the one known static inline script) broke real page
       rendering in production - the header nav lost its flex/desktop
       layout entirely - even though it looked clean in local testing (no
       CSP violations seen against a local build). Root cause not fully
       identified before reverting; something in the actual production
       bundle depends on an inline script this repo hasn't inventoried yet.
       Re-attempting this needs the real Chrome DevTools Console open
       against a production build (this extension's console/network
       capture tools did not surface the CSP violation) to find exactly
       what's being blocked before changing this again. -->
